name: Monitor Albo Pretorio Marsala

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: albo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla albo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python albo_monitor.py
      - name: Salva stato
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "albo-monitor"
            git config user.email "albo-monitor@users.noreply.github.com"
            git add state.json
            git commit -m "stato albo $(date -u +%FT%TZ)" -q
            git push -q
          fi
